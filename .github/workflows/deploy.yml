# Publica o site automaticamente no Firebase Hosting a cada push na branch main.
# Precisa do secret FIREBASE_SERVICE_ACCOUNT no GitHub (veja o README).
name: Deploy site (Firebase Hosting)

on:
  push:
    branches: [main]
    paths: ["public/**", "firebase.json", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
